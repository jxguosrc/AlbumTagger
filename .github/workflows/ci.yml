name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test AlbumTagger.slnx -c Release

  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish AlbumTagger.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/AlbumTagger-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: AlbumTagger-win-x64
          path: artifacts/AlbumTagger-win-x64
